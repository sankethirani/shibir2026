<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swami schedule · Shibir 2026</title>
<style>
:root{--bg:#F1F3FA;--sf:#fff;--ink:#181B38;--mut:#565C7A;--ln:#DADFEE;--ad:#3A3F9C;--adbg:#E6E8FA;--kd:#8A5600;--kdbg:#FFF1CC;--kb:#E0A100;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101220;--sf:#1A1D30;--ink:#ECEEF9;--mut:#A3A9C6;--ln:#2C3050;--ad:#AEB4FF;--adbg:#26295A;--kd:#F2B84B;--kdbg:#3A2C0A;--kb:#F2B84B}}
:root[data-theme="dark"]{--bg:#101220;--sf:#1A1D30;--ink:#ECEEF9;--mut:#A3A9C6;--ln:#2C3050;--ad:#AEB4FF;--adbg:#26295A;--kd:#F2B84B;--kdbg:#3A2C0A;--kb:#F2B84B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:920px;margin:0 auto;padding:1.6rem 1rem 3rem}
h1{font-size:clamp(2rem,7vw,3.3rem);line-height:1.02;letter-spacing:-.025em;font-weight:750;margin:0 0 .5rem}
.sub{color:var(--mut);margin:0 0 1.4rem;font-size:1.02rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:.5rem 0 .7rem}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ad);outline-offset:2px}
.day{border:1.5px solid var(--ln);background:var(--sf);border-radius:12px;padding:.6rem .3rem;text-align:center;font-weight:650;line-height:1.15}
.day small{display:block;font-weight:500;color:var(--mut);font-size:.78rem;margin-top:.15rem}
.day[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed=true] small{color:inherit;opacity:.8}
.filters{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;margin:.7rem 0 0}
.seg{display:inline-flex;border:1.5px solid var(--ln);border-radius:999px;background:var(--sf);padding:2px}
.seg button{border:0;background:none;padding:.35rem .85rem;border-radius:999px;font-size:.92rem;font-weight:550}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.1rem .1rem .3rem;margin-top:.55rem;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1.5px solid var(--ln);background:var(--sf);border-radius:999px;padding:.3rem .8rem;font-size:.9rem;font-weight:550;display:flex;align-items:center;gap:.4rem}
.chip i{width:.7rem;height:.7rem;border-radius:50%;background:var(--c,var(--mut))}
.chip[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.legend{font-size:.82rem;color:var(--mut);margin:.2rem 0 0}
ol{list-style:none;margin:.6rem 0 0;padding:0;background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:5rem 1fr;gap:.55rem 1rem;padding:1rem 1rem 1.05rem .9rem;border-left:5px solid var(--rb);border-top:1px solid var(--ln)}
.row:first-child{border-top:0}
.row.A{--rb:var(--ad)}.row.K{--rb:var(--kb)}.row.AK{--rb:transparent;border-image:linear-gradient(var(--ad) 50%,var(--kb) 50%) 1}
